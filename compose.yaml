services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["127.0.0.1:5435:5432"]  # 5432 is native PostgreSQL 18; 5433 and 5434 are taken by other containers
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
